[platformio]
default_envs = cardputer
; A core of its own, not the shared ~/.platformio: every pioarduino release installs its
; framework under the same package names, so a project on another release swaps
; Rattlebox's framework out, and a build that overlaps the swap compiles against half of
; each. Measured on 2026-10-23 with three local projects on 55.03.34: two failed builds,
; one with the core and the IDF libs of different releases (slice 0004).
core_dir = .platformio

; ============================================================
;  Common settings shared by all hardware targets
; ============================================================
[common]
; Pinned: an unpinned "espressif32" resolves to whichever release is already in
; the global PlatformIO cache, so two machines can build different cores.
; pioarduino 55.03.37 ships Arduino core 3.3.7, the core Dragon Radar verified both
; boards against (ADR-0001).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps =
    lovyan03/LovyanGFX @ 1.2.19
build_flags =
    -DCORE_DEBUG_LEVEL=3
; Only our code: the framework's own headers do not build clean under -Wextra. The
; framework also passes -Wno-unused-parameter and -Wno-sign-compare, which beat -Wextra
; whatever the order, so those two are named again here.
build_src_flags =
    -Wall
    -Wextra
    -Wunused-parameter
    -Wsign-compare

; ============================================================
;  M5Stack Cardputer ADV (M5StampS3)
; ============================================================
[env:cardputer]
platform = ${common.platform}
board = m5stack-stamps3
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_src_flags = ${common.build_src_flags}
build_flags =
    ${common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_CARDPUTER
build_src_filter = +<*> -<hal/boards/*> +<hal/boards/cardputer/>

; ============================================================
;  M5StickC Plus 2
; ============================================================
[env:m5stickc-plus2]
platform = ${common.platform}
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_src_flags = ${common.build_src_flags}
build_flags =
    ${common.build_flags}
    -DBOARD_M5STICKC
build_src_filter = +<*> -<hal/boards/*> +<hal/boards/m5stickc/>

; ============================================================
;  Native (unit tests on host, no hardware)
; ============================================================
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -D UNIT_TEST
    -D UNITY_INCLUDE_DOUBLE
    -Itest/mocks
; Each test includes the .cpp files it covers, so nothing under src/ is built here.
build_src_filter = -<*>
