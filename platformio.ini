[platformio]
default_envs = cardputer
; A core of its own, not the shared ~/.platformio: every pioarduino release installs its
; framework under the same package names, so a project on another release swaps
; Rattlebox's framework out, and a build that overlaps the swap compiles against half of
; each. Measured on 2026-10-23 with three local projects on 55.03.34: two failed builds,
; one with the core and the IDF libs of different releases (slice 0004).
core_dir = .platformio

; ============================================================
;  Common settings shared by all hardware targets
; ============================================================
[common]
; Pinned: an unpinned "espressif32" resolves to whichever release is already in
; the global PlatformIO cache, so two machines can build different cores.
; pioarduino 55.03.37 ships Arduino core 3.3.7, the core Dragon Radar verified both
; boards against (ADR-0001).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps =
    lovyan03/LovyanGFX @ 1.2.19
build_flags =
    -DCORE_DEBUG_LEVEL=3
; Only our code: the framework's own headers do not build clean under -Wextra. The
; framework also passes -Wno-unused-parameter and -Wno-sign-compare, which beat -Wextra
; whatever the order, so those two are named again here.
build_src_flags =
    -Wall
    -Wextra
    -Wunused-parameter
    -Wsign-compare

; ============================================================
;  M5Stack Cardputer ADV (M5StampS3)
; ============================================================
[env:cardputer]
platform = ${common.platform}
board = m5stack-stamps3
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_src_flags = ${common.build_src_flags}
build_flags =
    ${common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_CARDPUTER
build_src_filter = +<*> -<hal/boards/*> +<hal/boards/cardputer/> -<probes/>

; ============================================================
;  M5StickC Plus 2
; ============================================================
[env:m5stickc-plus2]
platform = ${common.platform}
; No board definition for the Plus 2 ships with the platform, so the generic esp32dev is corrected to
; the chip, which esptool reads as 8 MB of flash: the size, partitions and flash clock of the Arduino
; core's own m5stack_stickc_plus2 entry. The PSRAM in its package stays off: without BOARD_HAS_PSRAM
; the core compiles it out, which keeps the canvas in internal RAM that DMA can read (ADR-0020).
board = esp32dev
board_upload.flash_size = 8MB
board_upload.maximum_size = 3342336
board_build.partitions = default_8MB.csv
board_build.f_flash = 80000000L
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_src_flags = ${common.build_src_flags}
build_flags =
    ${common.build_flags}
    -DBOARD_M5STICKC
build_src_filter = +<*> -<hal/boards/*> +<hal/boards/m5stickc/> -<probes/>

; ============================================================
;  IMU probe firmwares (slice 0004)
; ============================================================
; Each probe has a folder of its own under src/probes/, and each probe env takes only its
; own: two entry points in one build would both define setup() (slice 0006).
; The product's HAL and drivers under the probe's entry point instead of main.cpp, so what
; the probe measures is what the product runs. The rate is each chip's fastest that a
; 400 kHz I2C burst read keeps up with: the BMI270's rates are 25 x 2^n Hz, and the
; MPU6886's are 1 kHz / (1 + divider).
[env:cardputer-imu-probe]
extends = env:cardputer
build_flags =
    ${env:cardputer.build_flags}
    -DIMU_PROBE_OUTPUT_RATE_HZ=800
build_src_filter = +<*> -<hal/boards/*> +<hal/boards/cardputer/> -<main.cpp> -<debug/> -<probes/*> +<probes/imu/>

[env:m5stickc-plus2-imu-probe]
extends = env:m5stickc-plus2
build_flags =
    ${env:m5stickc-plus2.build_flags}
    -DIMU_PROBE_OUTPUT_RATE_HZ=1000
build_src_filter = +<*> -<hal/boards/*> +<hal/boards/m5stickc/> -<main.cpp> -<debug/> -<probes/*> +<probes/imu/>

; The same probes at 100 Hz, the rate the probe chose by simulating it from the fast
; captures. These confirm the choice on the chips' own decimation and filtering, which the
; simulation only approximates (slice 0004).
[env:cardputer-imu-probe-100hz]
extends = env:cardputer-imu-probe
build_flags =
    ${env:cardputer.build_flags}
    -DIMU_PROBE_OUTPUT_RATE_HZ=100

[env:m5stickc-plus2-imu-probe-100hz]
extends = env:m5stickc-plus2-imu-probe
build_flags =
    ${env:m5stickc-plus2.build_flags}
    -DIMU_PROBE_OUTPUT_RATE_HZ=100

; ============================================================
;  Skeleton check firmwares (slice 0003, moved in slice 0011)
; ============================================================
; Slice 0003's readout of raw IMU samples and presses, which scripts/skeleton-verify.mjs checks
; the boards' HAL against. The product replaced it as main.cpp, so it sits with the other
; alternative entry points under src/probes/, which the product envs leave out.
[env:cardputer-skeleton]
extends = env:cardputer
build_src_filter = +<*> -<hal/boards/*> +<hal/boards/cardputer/> -<main.cpp> -<probes/*> +<probes/skeleton/>

[env:m5stickc-plus2-skeleton]
extends = env:m5stickc-plus2
build_src_filter = +<*> -<hal/boards/*> +<hal/boards/m5stickc/> -<main.cpp> -<probes/*> +<probes/skeleton/>

; ============================================================
;  Render probe firmwares (slice 0006)
; ============================================================
; The product's display path under the probe's entry point. The screen capture comes
; along, so the host saves the canvas the last frame was drawn into.
[env:cardputer-render-probe]
extends = env:cardputer
build_src_filter = +<*> -<hal/boards/*> +<hal/boards/cardputer/> -<main.cpp> -<probes/*> +<probes/render/>

[env:m5stickc-plus2-render-probe]
extends = env:m5stickc-plus2
build_src_filter = +<*> -<hal/boards/*> +<hal/boards/m5stickc/> -<main.cpp> -<probes/*> +<probes/render/>

; ============================================================
;  I2C bus clear probe firmware (ADR-0019)
; ============================================================
; Leaves the MPU6886 holding the bus, as a reset mid-read does, then starts the product's IMU driver.
[env:m5stickc-plus2-i2c-clear-probe]
extends = env:m5stickc-plus2
build_src_filter = +<*> -<hal/boards/*> +<hal/boards/m5stickc/> -<main.cpp> -<debug/> -<probes/*> +<probes/i2c_clear/>

; ============================================================
;  PSRAM probe firmware (ADR-0020)
; ============================================================
; Asks whether the PICO-V3-02's PSRAM is started and on the heap under the env's board settings, and
; whether it works when started by hand (ADR-0020).
[env:m5stickc-plus2-psram-probe]
extends = env:m5stickc-plus2
build_src_filter = -<*> +<probes/psram/>

; ============================================================
;  Native (unit tests on host, no hardware)
; ============================================================
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -D UNIT_TEST
    -D UNITY_INCLUDE_DOUBLE
    -Itest/mocks
    ; The fairness test (invariant #2) simulates tens of thousands of rolls; optimised, they take
    ; seconds rather than minutes.
    -O2
    ; Host GCC 13.3 miscompiles the launch at -O2 through modref: every launch orientation in a
    ; loop turned the same face to the glass. Correct at -O0, under clang -O2, under ASan and
    ; UBSan (which report nothing), and with this pass off; a GCC debug-counter bisection put it
    ; on one modref points-to decision (ADR-0009). test_launch's uniformity test is the guard.
    -fno-ipa-modref
; Each test includes the .cpp files it covers, so nothing under src/ is built here.
build_src_filter = -<*>

; The fairness test three dice at a time (invariant #2, ADR-0010): minutes longer than one at a
; time, so `npm test` leaves it out and `npm run test:fairness` runs it before a change to the
; physics or its input merges.
[env:native-fairness]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -D FAIRNESS_THREE_DICE
test_filter = test_fairness

; ============================================================
;  Fairness probe (slice 0008): a host program, not firmware
; ============================================================
; The physics core the product runs, compiled natively with the native env's flags, so the probe
; measures the same code the fairness test checks. scripts/fairness-probe.mjs builds and runs it.
[env:native-fairness-probe]
platform = native
build_flags = ${env:native.build_flags}
build_src_filter = +<geometry/> +<physics/> +<imu/shake_detector.cpp> +<imu/still_span.cpp> +<imu/reading_average.cpp> +<roll/dice_roll.cpp>
    +<roll/shake_roll.cpp> +<probes/fairness/>

; ============================================================
;  Clack probe (slice 0013): a host program, not firmware
; ============================================================
; The fixtures' hits through the product's physics, kick and HitFinder; the fairness replay is
; reused without its program.
[env:native-clack-probe]
platform = native
build_flags = ${env:native.build_flags}
build_src_filter = +<geometry/> +<physics/> +<imu/shake_detector.cpp> +<imu/still_span.cpp> +<imu/reading_average.cpp> +<roll/dice_roll.cpp>
    +<roll/shake_roll.cpp> +<sound/hit_finder.cpp> +<probes/fairness/> -<probes/fairness/fairness_probe_main.cpp>
    +<probes/clack/>

; Slice 0014's level probe: the StickC's upright shake captures replayed through ShakeRoll.
[env:native-level-probe]
platform = native
build_flags = ${env:native.build_flags}
build_src_filter = +<geometry/> +<physics/> +<imu/shake_detector.cpp> +<imu/still_span.cpp> +<imu/reading_average.cpp> +<roll/dice_roll.cpp>
    +<roll/shake_roll.cpp> +<probes/fairness/> -<probes/fairness/fairness_probe_main.cpp> +<probes/level/>
